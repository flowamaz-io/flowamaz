name: E2E

# The Playwright suite (web/e2e) against a throwaway stack: Postgres/Redis/Mailpit from docker-compose.dev.yml, the
# API, the web app and the marketing site. CI runs the same script as a local run (scripts/e2e-local.sh), so a
# failure here reproduces with `./scripts/e2e-local.sh`.
on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright's Chromium and its system libraries
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the suite
        env:
          CI: 'true'
        run: ./scripts/e2e-local.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/e2e-results.json
            web/e2e/test-results/
            web/e2e/.local-run/*.log
          retention-days: 14
