name: Publish engine package

# Publishes Flowamaz.Engine.Core to nuget.org when a tag like engine-v0.1.0 is pushed.
# The tag's version must match <Version> in engine/Flowamaz.Engine.Core/Flowamaz.Engine.Core.csproj.
# Needs the repository secret NUGET_API_KEY (a nuget.org API key scoped to Flowamaz.* packages).

on:
  push:
    tags: ['engine-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: engine/global.json
      - name: Check the tag matches the project version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#engine-v}"
          PROJECT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Flowamaz.Engine.Core/Flowamaz.Engine.Core.csproj)
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match project version $PROJECT_VERSION. Bump <Version> or retag." >&2
            exit 1
          fi
      - run: dotnet test Flowamaz.Engine.slnx -c Release
      - run: dotnet pack Flowamaz.Engine.Core -c Release -o ../artifacts
      - run: dotnet nuget push "../artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
