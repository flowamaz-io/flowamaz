events { worker_connections 1024; }

http {
  # Fixed-window rate limit zones (defence-in-depth; the API also enforces its own limits).
  # nginx only accepts r/s or r/m — the register endpoint's precise 5/hour/IP cap is enforced
  # by the API; here we set the tightest valid nginx rate (1r/m) as a coarse proxy-level guard.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=register:10m rate=1r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

  # HTTP → HTTPS redirect.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers (applied to every response).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Login — tight limit.
    location = /api/v1/auth/login {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Register — tightest limit.
    location = /api/v1/auth/register {
      limit_req zone=register burst=2 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API.
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /scalar {
      proxy_pass http://backend:8080;
      proxy_set_header Host $host;
    }

    location /health {
      proxy_pass http://backend:8080;
      access_log off;
    }

    # Frontend SPA.
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
