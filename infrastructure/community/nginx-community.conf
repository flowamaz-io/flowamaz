worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream backend { server flowamaz:8080; }
    upstream web     { server web:80; }

    server {
        listen 80;
        server_name _;

        # Common proxy headers inherited by all locations below.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API + Scalar docs + health → backend.
        location /api/   { proxy_pass http://backend; }
        location /scalar { proxy_pass http://backend; }
        location /health { proxy_pass http://backend; }

        # Live instance-status WebSocket → backend (upgrade headers).
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Everything else → SPA.
        location / { proxy_pass http://web; }
    }
}
