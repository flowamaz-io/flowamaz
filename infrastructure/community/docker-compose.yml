# Flowamaz Community Edition — full stack in one file.
# Run with: docker compose -f docker-compose.yml --env-file .env up -d
# Community edition is HTTP-only on port 3000 (no SSL — simpler for local installs).

services:
  flowamaz:
    image: ghcr.io/flowamaz-io/flowamaz-backend:latest
    environment:
      EDITION: community
      ASPNETCORE_ENVIRONMENT: Production
      DB_CONNECTION_STRING: Host=db;Database=flowamaz;Username=flowamaz;Password=${POSTGRES_PASSWORD:-flowamaz_local}
      REDIS_CONNECTION_STRING: redis:6379
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_IN_PRODUCTION}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:-CHANGE_THIS_IN_PRODUCTION}
      GATE_SIGNING_KEY: ${GATE_SIGNING_KEY:-CHANGE_THIS_IN_PRODUCTION}
      GIT_REPOS_BASE_PATH: /app/data/repos
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - gitrepos:/app/data/repos
    depends_on:
      - db
      - redis
    restart: unless-stopped

  web:
    image: ghcr.io/flowamaz-io/flowamaz-web:latest
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx-community.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flowamaz
      - web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowamaz
      POSTGRES_USER: flowamaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowamaz_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
  gitrepos: {}
