# Full Flowamaz stack: nginx proxy (TLS) → web (SPA) + backend (API) → postgres + redis.
#   docker compose -f infrastructure/docker-compose.yml up -d
# Requires ../.env (copy from ../.env.example) and a dev cert in ./nginx/ssl
# (run ./nginx/ssl/generate-dev-cert.sh first).
services:
  proxy:
    image: nginx:alpine
    container_name: flowamaz-proxy
    ports:
      - "8306:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - web
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: flowamaz-backend
    env_file: ../.env
    environment:
      # Override the documented host-dev connection strings with the in-network service names.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8307"
      DB_CONNECTION_STRING: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      REDIS_CONNECTION_STRING: "redis:6379"
      # Run third-party connectors and Script/Shell in the sandbox container.
      Connectors__Sandbox__Url: "http://connector-runner:8080"
      CONNECTOR_RUNNER_SECRET: ${CONNECTOR_RUNNER_SECRET:?set CONNECTOR_RUNNER_SECRET (32+ chars)}
    networks: [default, sandbox]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8307/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: flowamaz-web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: flowamaz-db
    env_file: ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flowamaz-redis
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # ── Connector sandbox (FUNCTIONAL.md §9.5) ─────────────────────────────────────────────
  # Third-party connector calls and Script/Shell steps run here, not in the API. The runner sits
  # only on the internal "sandbox" network (no route to the internet, db or redis); its sole way
  # out is the egress proxy, which refuses private/loopback/metadata addresses and non-80/443 ports.
  connector-runner:
    build:
      context: ../backend
      dockerfile: Dockerfile.runner
    container_name: flowamaz-connector-runner
    environment:
      CONNECTOR_RUNNER_SECRET: ${CONNECTOR_RUNNER_SECRET:?set CONNECTOR_RUNNER_SECRET (32+ chars) in ../.env}
      HTTPS_PROXY: http://egress-proxy:3128
      HTTP_PROXY: http://egress-proxy:3128
      NO_PROXY: ""
      Connectors__ScriptShell__Enabled: "true"
      Runner__MaxConcurrency: "16"
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    depends_on:
      - egress-proxy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  egress-proxy:
    build:
      context: ../backend
      dockerfile: Dockerfile.egress-proxy
    container_name: flowamaz-egress-proxy
    environment:
      Proxy__Port: "3128"
      Proxy__AllowedPorts: "443,80"
      Proxy__AllowPrivateNetworks: "false"
    networks: [sandbox, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  default: {}
  # Internal only: no gateway to the outside world. API ↔ runner ↔ egress proxy.
  sandbox:
    internal: true
  # The egress proxy's route out.
  egress: {}

volumes:
  pgdata:
  redisdata:
