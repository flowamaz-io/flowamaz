# Full Flowamaz stack: nginx proxy (TLS) → web (SPA) + backend (API) → postgres + redis.
#   docker compose -f infrastructure/docker-compose.yml up -d
# Requires ../.env (copy from ../.env.example) and a dev cert in ./nginx/ssl
# (run ./nginx/ssl/generate-dev-cert.sh first).
services:
  proxy:
    image: nginx:alpine
    container_name: flowamaz-proxy
    ports:
      - "8306:80"
      - "8306:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - web
    restart: unless-stopped

  backend:
    build: ../backend
    container_name: flowamaz-backend
    env_file: ../.env
    environment:
      # Override the documented host-dev connection strings with the in-network service names.
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8307"
      DB_CONNECTION_STRING: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      REDIS_CONNECTION_STRING: "redis:6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8307/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build: ../web
    container_name: flowamaz-web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: flowamaz-db
    env_file: ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flowamaz-redis
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
