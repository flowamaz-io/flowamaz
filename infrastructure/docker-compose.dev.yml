# Dev-only Postgres + Redis + Mailpit (catches every email the API sends; inbox at http://localhost:8026). The app itself runs locally on the host via `dotnet run` —
# the full app/proxy/web stack lands in prompt 07.
#
# Usage:
#   docker compose -f infrastructure/docker-compose.dev.yml up -d
#   docker compose -f infrastructure/docker-compose.dev.yml down
services:
  db:
    image: postgres:16-alpine
    container_name: flowamaz-dev-db
    environment:
      POSTGRES_DB: flowamaz
      POSTGRES_USER: flowamaz
      POSTGRES_PASSWORD: flowamaz_dev
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowamaz"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowamaz-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local email: the API sends over SMTP to Mailpit when Email__SmtpHost is set (start-local does).
  # Ports 1026/8026, not Mailpit's usual 1025/8025, so it runs next to the loan application's own Mailpit.
  mailpit:
    image: axllent/mailpit:latest
    container_name: flowamaz-dev-mailpit
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # inbox UI and API

volumes:
  pgdata:
  redisdata:
